<!-- PrepperFamily — Header (EN) · redesign: same content, links and behavior; refreshed visual system -->
<header class="site-header" id="site-header">

<style>
.site-header{
  --sh-bg:#fdfaf4;
  --sh-text:#2a2420;
  --sh-border:rgba(42,36,30,.08);
  --sh-gold-light:#f0d493;
  --sh-gold-deep:#cfa435;
  --sh-gold-ink:#3a2c0e;
  --sh-accent:#8a6006;
  --sh-shadow:0 1px 0 rgba(42,36,30,.05);
  --sh-shadow-lg:0 20px 36px -22px rgba(30,24,16,.32), 0 1px 0 rgba(42,36,30,.08);
  --sh-ease:cubic-bezier(.4,0,.2,1);

  position:sticky;
  top:0;
  z-index:1000;
  background:var(--sh-bg);
  border-bottom:1px solid var(--sh-border);
  box-shadow:var(--sh-shadow);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:box-shadow .4s var(--sh-ease);
}

.site-header.is-scrolled{ box-shadow:var(--sh-shadow-lg); }

.header-container{
  max-width:1200px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:clamp(12px,3vw,24px);
  padding:16px clamp(16px,4vw,32px);
  position:relative;
  transition:padding .35s var(--sh-ease);
}

.site-header.is-scrolled .header-container{ padding-top:10px; padding-bottom:10px; }

.logo{ flex:0 0 auto; }
.logo a{ display:block; line-height:0; }
.logo img{
  height:52px;
  display:block;
  transition:height .35s var(--sh-ease);
}
.site-header.is-scrolled .logo img{ height:42px; }

.header-right{
  display:flex;
  align-items:center;
  gap:clamp(14px,2.4vw,24px);
  margin-left:auto;
}

.nav{
  display:flex;
  gap:clamp(18px,2.2vw,30px);
  align-items:center;
}

.nav a{
  position:relative;
  text-decoration:none;
  color:var(--sh-text);
  font-size:15.5px;
  font-weight:500;
  letter-spacing:.01em;
  line-height:1.2;
  padding:8px 1px;
  display:inline-flex;
  align-items:center;
  white-space:nowrap;
  transition:color .25s var(--sh-ease);
}

.nav a::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:2px;
  height:2px;
  border-radius:2px;
  background:linear-gradient(90deg,var(--sh-gold-deep),var(--sh-accent));
  transform:scaleX(0);
  transform-origin:right;
  transition:transform .3s var(--sh-ease);
}

.nav a:hover,
.nav a:focus-visible{ color:var(--sh-accent); }

.nav a:hover::after,
.nav a:focus-visible::after{
  transform:scaleX(1);
  transform-origin:left;
}

.nav a:focus-visible{
  outline:none;
  border-radius:4px;
  box-shadow:0 0 0 3px rgba(138,96,6,.28);
}

.home-link{ font-weight:700; }

.language-switcher{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  background:linear-gradient(135deg,var(--sh-gold-light),var(--sh-gold-deep));
  color:var(--sh-gold-ink);
  border:none;
  border-radius:999px;
  padding:.5rem 1rem;
  font-size:.82rem;
  font-weight:600;
  letter-spacing:.01em;
  text-decoration:none;
  white-space:nowrap;
  flex:0 0 auto;
  box-shadow:0 4px 14px rgba(138,96,6,.22);
  transition:transform .25s var(--sh-ease), box-shadow .25s var(--sh-ease);
}

.language-switcher svg{ width:15px; height:15px; flex:0 0 auto; }

.language-switcher:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(138,96,6,.3);
  color:var(--sh-gold-ink);
}

.language-switcher:focus-visible{
  outline:none;
  box-shadow:0 8px 20px rgba(138,96,6,.3), 0 0 0 3px rgba(138,96,6,.3);
}

.menu-icon{
  display:none;
  position:relative;
  width:40px;
  height:40px;
  padding:0;
  border:none;
  background:transparent;
  border-radius:8px;
  cursor:pointer;
  flex:0 0 auto;
  -webkit-tap-highlight-color:transparent;
}

.menu-icon:hover{ background:rgba(42,36,30,.06); }

.menu-icon:focus-visible{
  outline:none;
  box-shadow:0 0 0 3px rgba(138,96,6,.3);
}

.menu-icon-bar{
  position:absolute;
  left:9px;
  right:9px;
  height:2px;
  background:var(--sh-text);
  border-radius:2px;
  transition:transform .3s var(--sh-ease), opacity .2s var(--sh-ease), top .3s var(--sh-ease);
}

.menu-icon-bar:nth-child(1){ top:14px; }
.menu-icon-bar:nth-child(2){ top:19px; }
.menu-icon-bar:nth-child(3){ top:24px; }

.site-header.menu-open .menu-icon-bar:nth-child(1){ top:19px; transform:rotate(45deg); }
.site-header.menu-open .menu-icon-bar:nth-child(2){ opacity:0; }
.site-header.menu-open .menu-icon-bar:nth-child(3){ top:19px; transform:rotate(-45deg); }

@media (max-width:768px){
  .header-container{ padding:12px clamp(16px,5vw,24px); }
  .logo img{ height:44px; }
  .site-header.is-scrolled .logo img{ height:38px; }

  .header-right{ gap:10px; }

  .language-switcher{ padding:.42rem .85rem; font-size:.76rem; }

  .menu-icon{ display:block; }

  .nav{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:var(--sh-bg);
    flex-direction:column;
    align-items:stretch;
    gap:0;
    padding:8px 0 16px;
    border-top:1px solid var(--sh-border);
    border-bottom:1px solid var(--sh-border);
    box-shadow:0 24px 34px -22px rgba(30,24,16,.28);
    opacity:0;
    visibility:hidden;
    transform:translateY(-8px);
    transition:opacity .3s var(--sh-ease), transform .3s var(--sh-ease), visibility 0s linear .3s;
  }

  .site-header.menu-open .nav{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
    transition:opacity .3s var(--sh-ease), transform .3s var(--sh-ease), visibility 0s linear 0s;
  }

  .nav a{
    padding:14px 24px;
    font-size:17px;
    font-weight:600;
    border-top:1px solid rgba(138,96,6,.12);
    opacity:0;
    transform:translateY(-6px);
    transition:opacity .3s var(--sh-ease), transform .3s var(--sh-ease), color .2s var(--sh-ease);
  }

  .nav a::after{ display:none; }
  .nav a:first-child{ border-top:none; }

  .site-header.menu-open .nav a{ opacity:1; transform:translateY(0); }
  .site-header.menu-open .nav a:nth-child(1){ transition-delay:.05s; }
  .site-header.menu-open .nav a:nth-child(2){ transition-delay:.09s; }
  .site-header.menu-open .nav a:nth-child(3){ transition-delay:.13s; }
  .site-header.menu-open .nav a:nth-child(4){ transition-delay:.17s; }
  .site-header.menu-open .nav a:nth-child(5){ transition-delay:.21s; }
}

@media (prefers-reduced-motion:reduce){
  .site-header,
  .site-header *{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>

<div class="header-container">

  <div class="logo">
    <a href="/">
      <img src="/assets/images/header/logo.webp" alt="PrepperFamily">
    </a>
  </div>

  <div class="header-right">

    <a href="/es/" class="language-switcher" aria-label="Cambiar a español">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Español
    </a>

    <button type="button" class="menu-icon" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      <span class="menu-icon-bar"></span>
      <span class="menu-icon-bar"></span>
      <span class="menu-icon-bar"></span>
    </button>

    <nav class="nav" id="site-nav" aria-label="Primary">
      <a href="/" class="home-link">Home</a>
      <a href="/en/material-support/">Material Support</a>
      <a href="/en/family-resilience/">Family Resilience</a>
      <a href="/en/inner-strength/">Inner Strength</a>
      <a href="/#community">Community</a>
    </nav>

  </div>
</div>

<script>
(function(){
  var header = document.getElementById('site-header');
  var toggle = document.getElementById('nav-toggle');
  var nav = document.getElementById('site-nav');
  if(!header || !toggle || !nav) return;

  function closeMenu(){
    header.classList.remove('menu-open');
    toggle.setAttribute('aria-expanded','false');
  }
  function openMenu(){
    header.classList.add('menu-open');
    toggle.setAttribute('aria-expanded','true');
  }

  toggle.addEventListener('click', function(){
    if(header.classList.contains('menu-open')){ closeMenu(); } else { openMenu(); }
  });

  nav.addEventListener('click', function(e){
    if(e.target.tagName === 'A'){ closeMenu(); }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closeMenu(); }
  });

  document.addEventListener('click', function(e){
    if(header.classList.contains('menu-open') && !header.contains(e.target)){ closeMenu(); }
  });

  var scrolled = false;
  function onScroll(){
    var shouldBeScrolled = window.scrollY > 8;
    if(shouldBeScrolled !== scrolled){
      scrolled = shouldBeScrolled;
      header.classList.toggle('is-scrolled', scrolled);
    }
  }
  onScroll();
  window.addEventListener('scroll', onScroll, { passive:true });
})();
</script>

</header>
