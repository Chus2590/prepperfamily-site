<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My saved guides | PrepperFamily.org</title>
<meta name="description" content="Your favorite PrepperFamily.org guides, saved on your phone to read whenever you need them.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://prepperfamily.org/en/saved/">
<link rel="alternate" hreflang="en" href="https://prepperfamily.org/en/saved/">
<link rel="alternate" hreflang="es" href="https://prepperfamily.org/es/guardados/">
<link rel="alternate" hreflang="x-default" href="https://prepperfamily.org/en/saved/">
<style>
  :root{
    --verde:#274828; --verde-oscuro:#1E3A24; --dorado:#C9A84C;
    --crema:#FBF6EC; --pergamino:#FDFBF7; --texto:#1A1A2E; --marron:#3A2F22;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--pergamino); color:var(--texto);
    font-family:'Libre Caslon Text', Georgia, 'Times New Roman', serif;
    line-height:1.6;
  }
  a{color:var(--verde)}
  .guardados{max-width:960px; margin:0 auto; padding:2.5rem 1.25rem 3rem}
  h1{color:var(--verde); font-size:2rem; margin:0 0 .5rem; line-height:1.2}
  .intro{color:var(--marron); max-width:38rem; margin:0 0 2rem}
  .count{color:var(--marron); font-size:.95rem; margin:0 0 1.25rem}
  .lista{display:grid; grid-template-columns:1fr; gap:1rem}
  .item{
    background:var(--crema); border:1px solid #E8E4DD; border-radius:6px;
    padding:1.1rem 1.25rem; display:flex; gap:1rem; align-items:flex-start; justify-content:space-between;
  }
  .item h2{font-size:1.2rem; margin:0 0 .25rem; line-height:1.3}
  .item h2 a{color:var(--verde); text-decoration:none}
  .item h2 a:hover{text-decoration:underline}
  .fecha{margin:0; color:var(--marron); font-size:.9rem}
  .quitar{
    flex-shrink:0; appearance:none; background:transparent; color:var(--marron);
    border:1px solid #D8D2C4; border-radius:999px; padding:.35rem .8rem;
    font-family:inherit; font-size:.85rem; cursor:pointer;
  }
  .quitar:hover{border-color:var(--dorado); color:var(--texto)}
  .vacio{
    background:var(--crema); border:1px solid #E8E4DD; border-radius:6px;
    padding:2rem 1.5rem; text-align:center; color:var(--marron);
  }
  .vacio p{margin:0 0 1rem}
  .btn{
    display:inline-block; background:var(--verde); color:var(--crema);
    text-decoration:none; padding:.6rem 1.2rem; border-radius:4px;
  }
  .btn:hover{background:var(--verde-oscuro)}
</style>
<!-- Tipografía del sitio: Libre Caslon Text (todo menos títulos) -->
<link rel="stylesheet" href="../../assets/css/tipografia-sitio.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#274828">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
    <script src="/assets/js/pwa-install.js?v=2" defer></script>
</head>
<body>
<div id="pf-header"></div>
<main class="guardados">
  <h1>My saved guides</h1>
  <p class="intro">The guides you saved to read or put into practice. They live on your phone, and if you already visited them, they open offline.</p>
  <p class="count" id="pf-saved-count"></p>
  <div class="lista" id="pf-saved-list"></div>
  <div class="vacio" id="pf-saved-empty" style="display:none">
    <p>You haven't saved any guides yet.</p>
    <p>When you read an article you want to keep close, tap “Save” at the end of the article.</p>
    <a class="btn" href="/en/material-support/store/">Explore guides →</a>
  </div>
</main>
<div id="pf-footer"></div>
<script>
  const isGitHub = location.hostname.endsWith("github.io");
  const base = isGitHub ? "/prepperfamily-site" : "";
  function setHTML(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }
  function loadHTML(url, targetId) {
    return fetch(url).then(res => { if (!res.ok) throw new Error("Failed to load " + url); return res.text(); })
      .then(html => setHTML(targetId, html)).catch(() => {});
  }
  loadHTML(`${base}/partials/header-en/`, "pf-header");
  loadHTML(`${base}/partials/footer-en/`, "pf-footer");

  // Saved list (lives on the phone)
  const KEY = "pf-guardados-v1";
  function readSaved() {
    try {
      const list = JSON.parse(localStorage.getItem(KEY) || "[]");
      return Array.isArray(list) ? list : [];
    } catch (_) { return []; }
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function render() {
    const list = readSaved();
    const box = document.getElementById("pf-saved-list");
    const empty = document.getElementById("pf-saved-empty");
    const count = document.getElementById("pf-saved-count");
    if (!list.length) {
      box.innerHTML = "";
      count.textContent = "";
      empty.style.display = "";
      return;
    }
    empty.style.display = "none";
    count.textContent = list.length === 1 ? "1 saved guide" : list.length + " saved guides";
    box.innerHTML = list.map(function (item, i) {
      const fecha = item.d ? new Date(item.d).toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" }) : "";
      return '<article class="item"><div><h2><a href="' + esc(item.u) + '">' + esc(item.t || item.u) + "</a></h2>" +
        (fecha ? '<p class="fecha">Saved on ' + esc(fecha) + "</p>" : "") +
        '</div><button type="button" class="quitar" data-i="' + i + '">Remove</button></article>';
    }).join("");
    box.querySelectorAll(".quitar").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const next = readSaved();
        next.splice(Number(btn.dataset.i), 1);
        try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (_) {}
        render();
      });
    });
  }
  render();
</script>
</body>
</html>
